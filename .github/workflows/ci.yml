name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production dependencies
        run: npm run audit:production
      - name: Reject critical development advisories
        run: npm run audit:critical
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile end-to-end tests
        run: npm run test:e2e
      - name: Save end-to-end results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 7
